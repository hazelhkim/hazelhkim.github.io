papers:
  - title: "What Hallucinations Have We Measured? Semantic Illusion, Confabulation, and Expressed Uncertainty"
    authors: "Hazel Kim, Jakub Binkowski, Ekaterina Fadeeva, Juan David Guerra, Yijie Hao, Zheng Yi Ho, Baixiang Huang, Buyun Liang, Siyuan Liang, Anh Tuan Luu, Potsawee Manakul, Niels Mündler-Sasahara, Aidar Myrzakhan, Shahrad Mohammadzadeh, Artem Shelmanov, Kai Shu, Ponhvoan Srey, Dacheng Tao, René Vidal, Haofei Yu, Lei Yu, Hongxiang Zhang, Yarin Gal, Hinrich Schütze, Philip H.S. Torr"
    venue: "Preprint"
    paper_pdf: https://arxiv.org/pdf/2610.38520
    thumb: /assets/paper-thumbs/measured-hallucinations.svg
    summary: "Defines hallucination as a confidently incorrect response, split into semantic illusion and confabulation by whether a semantically equivalent prompt recovers the correct answer, and kept separate from expressed uncertainty."
    slug: measured-hallucinations
    nlp: y
    selected: y

  - title: "FramingQA: Does the Question Shape the Answer? Measuring the Compositional Framing Effect"
    authors: "Hazel Kim, Andrew M. Bean, Guilherme Affonso Ferreira de Camargo, Shanyu Chauhan, Felix Drinkall, Jade Kosché, Chenyang Ma, Glory Nwaugbala, Nabeel Seedat, Bradley Max Segal, Samuel Recht, Hinrich Schütze, Philip Torr"
    venue: "Preprint"
    paper_pdf: https://arxiv.org/pdf/2609.07448
    thumb: /assets/paper-thumbs/framingqa.svg
    summary: "Introduces FramingQA, a benchmark of how question framing shifts LLM answers in law, medicine, finance, and robotics, even when the underlying facts stay fixed."
    slug: framingqa
    nlp: y
    selected: y

  - title: "Single LLM Debate, MoLaCE: Mixture of Latent Concept Experts Against Confirmation Bias"
    authors: "Hazel Kim, Philip Torr"
    venue: "Preprint"
    paper_pdf: https://arxiv.org/pdf/2512.23518
    thumb: /assets/paper-thumbs/molace.svg
    summary: "Introduces MoLaCE, an inference-time method that mixes latent-concept experts so a single LLM can resist confirmation bias—emulating multi-agent debate more efficiently and reducing echo-chamber effects."
    slug: molace
    nlp: y
    selected: y

  - title: "Measuring what Matters: Construct Validity in Large Language Model Benchmarks"
    authors: "Andrew M. Bean, Ryan Othniel Kearns, Angelika Romanou, Franziska Sofia Hafner, Harry Mayne, Jan Batzner, Negar Foroutan, Chris Schmitz, Karolina Korgul, Hunar Batra, Oishi Deb, Emma Beharry, Cornelius Emde, Thomas Foster, Anna Gausen, María Grandury, Simeng Han, Valentin Hofmann, Lujain Ibrahim, Hazel Kim, Hannah Rose Kirk, Fangru Lin, Gabrielle Kaili-May Liu, Lennart Luettgau, Jabez Magomere, Jonathan Rystrøm, Anna Sotnikova, Yushi Yang, Yilun Zhao, Adel Bibi, Antoine Bosselut, Ronald Clark, Arman Cohan, Jakob Nicolaus Foerster, Yarin Gal, Scott A. Hale, Inioluwa Deborah Raji, Christopher Summerfield, Philip Torr, Cozmin Ududec, Luc Rocher, Adam Mahdi"
    venue: "NeurIPS 2025 Datasets & Benchmarks"
    paper_pdf: https://openreview.net/pdf?id=mdA5lVvNcU
    thumb: /assets/paper-thumbs/construct-validity.svg
    summary: "A systematic review of 445 LLM benchmarks with 29 experts, showing how weak construct validity undermines claims about safety and capability, and offering eight recommendations for more rigorous evaluation."
    slug: construct-validity
    nlp: y
    selected: y

  - title: "Detecting LLM Hallucination through Layer-wise Information Deficiency"
    authors: "Hazel Kim, Tom A. Lamb, Adel Bibi, Philip Torr, Yarin Gal"
    venue: "EMNLP 2025"
    paper_pdf: /assets/docs/EMNLP25.pdf
    thumb: /assets/paper-thumbs/hallucination-layers.svg
    summary: "Detects hallucinations at test time by tracking usable-information deficiencies across model layers—especially under ambiguous or unanswerable prompts—without extra training or architecture changes."
    slug: hallucination-layers
    nlp: y
    selected: y

  - title: "How Ambiguous Are the Rationales For Natural Language Reasoning?"
    authors: "Hazel Kim"
    venue: "COLING 2025"
    paper_pdf: /assets/docs/COLING25.pdf
    thumb: /assets/paper-thumbs/ambiguous-rationales.svg
    summary: "Studies how uncertain or ambiguous rationales affect reasoning performance, and proposes a simple way for models to choose among reasoning paths when rationale quality is inconsistent."
    slug: ambiguous-rationales
    nlp: y
    selected: y

  - title: "ATHENA: Mathematical Reasoning with Thought Expansion"
    authors: "JB. Kim, Hazel Kim, Joonghyuk Hahn, Yo-Sub Han"
    venue: "EMNLP 2023"
    paper_pdf: https://arxiv.org/pdf/2311.01036.pdf
    thumb: /assets/paper-thumbs/athena.svg
    summary: "Presents ATHENA, an attention-based architecture that expands candidate mathematical thoughts step by step, improving math-word-problem solving under limited or varied training signals."
    slug: athena
    nlp: y
    selected: y

  - title: "ALP: Data Augmentation Using Lexicalized PCFGs for Few-Shot Text Classification"
    authors: "Hazel Kim, Daecheol Woo, Seong Joon Oh, Jeong-Won Cha, Yo-Sub Han"
    venue: "AAAI 2022"
    paper_pdf: /assets/docs/AAAI22.pdf
    thumb: /assets/paper-thumbs/alp.svg
    summary: "Generates syntactically diverse, label-preserving text with lexicalized PCFGs for few-shot classification, and pairs this with augmentation-aware train/validation splitting for stronger low-resource training."
    slug: alp
    nlp: y
    selected: y

  - title: "LST: Lexicon-Guided Self-Training for Few-Shot Text Classification"
    authors: "Hazel Kim*, Jaeman Son*, Yo-Sub Han"
    venue: "Arxiv"
    paper_pdf: https://arxiv.org/pdf/2202.02566.pdf
    thumb: /assets/paper-thumbs/lst.svg
    summary: "Improves few-shot self-training by guiding pseudo-labels with a refined lexicon, reducing overconfident early errors when only a handful of labeled examples are available."
    slug: lst
    nlp: y
    selected: y
