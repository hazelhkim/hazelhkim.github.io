<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>{% if page.title and page.title != "Home" %}{{ page.title }} · {% endif %}{{ site.data.main_info.name }}</title>
  <meta name="description" content="{% if page.excerpt %}{{ page.excerpt | strip_html | truncate: 160 }}{% else %}{{ site.description }}{% endif %}">
  <meta name="author" content="{{ site.data.main_info.name }}">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,500;0,6..72,600;1,6..72,500&family=Sora:wght@300;400;500;600&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="{{ '/libs/custom/my_css.css' | relative_url }}?v=hazelnut-header">
  <link rel="icon" type="image/png" href="{{ '/libs/icon.png' | relative_url }}?v=hazelnut-match">
</head>
<body>
  <div class="bg" aria-hidden="true"></div>

  <header class="site-header">
    <div class="wrap header-row">
      <a class="site-title" href="{{ '/' | relative_url }}">
        <img class="site-nut" src="{{ '/assets/hazelnut.png' | relative_url }}" alt="" width="28" height="28" aria-hidden="true">
        <span>{{ site.data.main_info.name }}</span>
      </a>
      <nav class="site-nav" aria-label="Primary">
          <a href="{{ '/' | relative_url }}" {% if page.url == '/' %}class="is-active"{% endif %}>About</a>
          <a href="{{ '/research/' | relative_url }}" {% if page.url contains '/research' %}class="is-active"{% endif %}>Research</a>
          <a href="{{ '/publications/' | relative_url }}" {% if page.url contains '/publications' %}class="is-active"{% endif %}>Publications</a>
          <a href="{{ '/blog/' | relative_url }}" {% if page.url contains '/blog' %}class="is-active"{% endif %}>Blog</a>
          <a href="{{ '/bio/' | relative_url }}" {% if page.url contains '/bio' %}class="is-active"{% endif %}>Bio</a>
        </nav>
    </div>
  </header>

  <main class="wrap">
    {{ content }}
  </main>

  <footer class="site-footer">
    <div class="wrap footer-row">
      <p><span class="footer-name">{{ site.data.main_info.name }}</span>
        <span class="footer-meta">{{ site.data.main_info.title }}</span></p>
      <div class="footer-links">
        <a href="{{ site.data.main_info.scholar }}" target="_blank" rel="noopener">Scholar</a>
        <a href="{{ site.data.main_info.github }}" target="_blank" rel="noopener">GitHub</a>
        <a href="{{ site.data.main_info.linkedin }}" target="_blank" rel="noopener">LinkedIn</a>
        <a href="{{ site.data.main_info.twitter }}" target="_blank" rel="noopener">X</a>
        <a href="{{ site.data.main_info.email_link }}">Email</a>
      </div>
    </div>
  </footer>

  <script src="{{ '/libs/custom/my_js.js' | relative_url }}"></script>
  {% if site.data.main_info.google_analystics_tracking_id %}
    {% include google_analytics.html %}
  {% endif %}
</body>
</html>
